name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: newsroom
          POSTGRES_PASSWORD: newsroom
          POSTGRES_DB: newsroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsroom -d newsroom_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEWSROOM_TEST_DATABASE_URL: postgresql+asyncpg://newsroom:newsroom@localhost:5432/newsroom_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q
      - name: Context graph
        run: python scripts/context_graph.py check
